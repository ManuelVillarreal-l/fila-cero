# El plan gratis de Render duerme el servicio tras 15 minutos sin uso.
# Esta tarea lo visita cada 10 minutos de 6 a. m. a 10 p. m. (hora de Colombia = UTC-5).
name: keep-alive

on:
  schedule:
    - cron: "*/10 11-23,0-3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar la API
        run: curl -s -m 90 https://filacero-backend.onrender.com/api/estado || true
